<script>
"use strict";
/* Zero-cost animatic. Every shot is a small drawing function of time.
   window.renderAt(t) is a pure function of t, so the recorder can step it frame by frame.
   Click the picture to play or pause. Click the timeline to jump. */
const cv = document.getElementById('c'), g = cv.getContext('2d');
const EP = window.EP, SHOTS = EP.shots, TOTAL = EP.length_s;
const W = 1000, H = 418, PX = 40, PY = 52, PS = 1.2;          // panel: 1200 x 502 = 2.39:1
const OCHRE = '#B48A5A', SKY = '#FF7A2E', SUNC = '#FFC37A', UMBER = '#3A1A12', BRONZE = '#C9962B',
      BONE = '#F4EFE6', BLUE = '#6FC3FF', ORG = '#FF8A1F', GOLD = '#FFE9A8', INK = '#15100E';
const CH = {
  A:  { skin: '#8A5A3C', armor: '#E9EDF2', trim: '#AEB6C2', cloth: '#F4EFE6', sash: '#2C5AA8', bow: '#2B2622', energy: BLUE },
  Ab: { skin: '#8A5A3C', armor: '#E9EDF2', trim: '#AEB6C2', cloth: '#F4EFE6', sash: '#2C5AA8', bow: '#2B2622', energy: BLUE },
  K:  { skin: '#A0673F', armor: '#C9962B', trim: '#8A6418', cloth: '#6B1F1A', sash: '#8E1F1A', bow: '#1F2A3A', energy: ORG },
  Kg: { skin: '#A0673F', armor: '#B58524', trim: '#8A6418', cloth: '#6B1F1A', sash: '#8E1F1A', bow: '#1F2A3A', energy: ORG },
  Kr: { skin: '#B07856', armor: '#E8B92F', trim: '#C9962B', cloth: '#E8B92F', sash: '#1E8C8C', bow: '#000', energy: GOLD },
  Sh: { skin: '#9A6A48', armor: '#23402E', trim: '#C9962B', cloth: '#23402E', sash: '#C9962B', bow: '#000', energy: null }
};
const CK = {
  A: { car: '#E9EDF2', trim: '#AEB6C2', horse: '#F4EFE6', horse2: '#D5D0C6', banner: '#F4EFE6', mark: '#3A2A20', driver: 'Kr', archer: 'A' },
  K: { car: '#C9962B', trim: '#6B1F1A', horse: '#5A3420', horse2: '#43261A', banner: '#8E1F1A', mark: '#E8B92F', driver: 'Sh', archer: 'K' }
};

/* ---------- small helpers ---------- */
let FLAT = null;                                   // when set, everything draws in this one flat color
const col = c => FLAT || c;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => { u = clamp(u); return u * u * (3 - 2 * u); };
const seg = (u, a, b) => clamp((u - a) / (b - a));
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function poly(pts, c) { g.fillStyle = col(c); g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); }
function circ(x, y, r, c) { g.fillStyle = col(c); g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { g.fillStyle = col(c); g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, 7); g.fill(); }
function line(pts, c, w = 2) { g.strokeStyle = col(c); g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); }
function glow(c, n) { if (FLAT) return; g.shadowColor = c; g.shadowBlur = n; }
function noglow() { g.shadowBlur = 0; }

/* ---------- world ---------- */
function bg(o = {}) {
  const hz = o.hz ?? 250, ox = o.ox || 0;
  let gr = g.createLinearGradient(0, 0, 0, hz);
  gr.addColorStop(0, '#B8401A'); gr.addColorStop(0.55, SKY); gr.addColorStop(1, SUNC);
  g.fillStyle = gr; g.fillRect(-200, -900, W + 400, hz + 900);
  if (o.sun) { const [sx, sy, sr] = o.sun; glow(SUNC, 50); circ(sx, sy, sr, '#FFF1CF'); noglow(); g.globalAlpha = 0.25; circ(sx, sy, sr * 2.4, SUNC); g.globalAlpha = 1; }
  if (!o.noArmy) {                                     // armies: flat silhouette bands with spears
    g.fillStyle = 'rgba(58,26,18,0.55)';
    for (let i = -4; i < 64; i++) {
      const x = ((i * 19 + ox * 0.25) % (W + 80) + W + 80) % (W + 80) - 40, hgt = 6 + rnd(i) * 7;
      if (x > 400 && x < 600 && !o.fullArmy) continue;   // the empty strip between the hosts
      g.fillRect(x, hz - hgt, 17, hgt + 1);
      g.fillRect(x + 4 + rnd(i + 5) * 8, hz - hgt - 10 - rnd(i + 2) * 9, 1.2, 14);
      if (rnd(i + 7) > 0.8) g.fillRect(x + 8, hz - hgt - 20, 7, 4);
    }
  }
  gr = g.createLinearGradient(0, hz, 0, H);
  gr.addColorStop(0, '#CFA676'); gr.addColorStop(1, '#8B6540');
  g.fillStyle = gr; g.fillRect(-200, hz, W + 400, H - hz + 300);
  g.strokeStyle = 'rgba(58,26,18,0.25)'; g.lineWidth = 1.5;   // chariot ruts and broken arrows
  for (let i = 0; i < 14; i++) {
    const y = hz + 8 + rnd(i + 40) * (H - hz), x = ((rnd(i + 60) * 1400 + ox) % 1400 + 1400) % 1400 - 200, len = 40 + rnd(i) * 160;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + 1); g.stroke();
  }
}
function dust(t, n = 12, y0 = 250, a = 0.10) {
  for (let i = 0; i < n; i++) {
    const x = (rnd(i + 3) * (W + 300) + t * 22 * (0.4 + rnd(i + 9))) % (W + 300) - 150, y = y0 + rnd(i + 21) * (H - y0);
    g.globalAlpha = a; ell(x, y, 90 + rnd(i) * 120, 14 + rnd(i + 1) * 16, '#FFD9A6'); g.globalAlpha = 1;
  }
}
function speedLines(t, n, c, a, sp = 900) {
  g.globalAlpha = a;
  for (let i = 0; i < n; i++) { const y = rnd(i + 70) * H, x = ((rnd(i + 90) * 1400 - t * sp * (0.6 + rnd(i))) % 1400 + 1400) % 1400 - 200; line([[x, y], [x + 80 + rnd(i) * 160, y]], c, 1 + rnd(i + 2) * 2); }
  g.globalAlpha = 1;
}
function vignette() {
  const gr = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.62);
  gr.addColorStop(0, 'rgba(20,8,4,0)'); gr.addColorStop(1, 'rgba(20,8,4,0.5)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

/* ---------- props and FX ---------- */
function bow(x, y, h, bend, c, pull, lit) {
  if (lit) glow(lit, 14);
  g.strokeStyle = col(c); g.lineWidth = Math.max(2, h / 28); g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y - h / 2); g.quadraticCurveTo(x + bend * 2, y, x, y + h / 2); g.stroke();
  noglow();
  if (pull !== null) line([[x, y - h / 2], [x - pull, y], [x, y + h / 2]], lit || '#E8E0D0', Math.max(0.8, h / 120));
}
function arrow(x, y, ang, len, c, head = 7) {
  g.save(); g.translate(x, y); g.rotate(ang);
  line([[-len, 0], [0, 0]], '#3A2A20', Math.max(1.2, head / 4));
  if (c) glow(c, 16); poly([[0, 0], [-head * 1.6, -head * 0.6], [-head * 1.6, head * 0.6]], c || '#DDD'); noglow();
  poly([[-len, 0], [-len - head, -head * 0.5], [-len + head * 0.6, 0], [-len - head, head * 0.5]], BONE);
  g.restore();
}
function streak(x1, y1, x2, y2, c, w = 4) {
  const gr = g.createLinearGradient(x1, y1, x2, y2); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, c);
  glow(c, 18); g.strokeStyle = gr; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  noglow(); circ(x2, y2, w * 0.9, '#FFF');
}
function lightning(x1, y1, x2, y2, seed, c, w, t) {
  const k = Math.floor(t * 12), n = 9, pts = [[x1, y1]];          // redrawn 12 times a second: 2D FX "on twos"
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  for (let i = 1; i < n; i++) { const o = (rnd(seed + i * 3 + k * 7) - 0.5) * L * 0.16; pts.push([x1 + dx * i / n - dy / L * o, y1 + dy * i / n + dx / L * o]); }
  pts.push([x2, y2]); glow(c, 20); line(pts, c, w * 2.2); noglow(); line(pts, '#FFF', w);
  const b = pts[3 + (k % 3)]; line([b, [b[0] + (rnd(seed + k) - 0.3) * 50, b[1] + (rnd(seed + k + 1) - 0.5) * 50]], c, w);
}
function flame(x, y, w, h, t, seed) {
  const sw = Math.sin(t * 9 + seed) * w * 0.25;
  [[ORG, 1], ['#FFC23A', 0.62], ['#FFF3B0', 0.3]].forEach(([c, k]) => {
    g.fillStyle = col(c); g.beginPath(); g.moveTo(x - w * k / 2, y);
    g.quadraticCurveTo(x - w * k * 0.7, y - h * k * 0.5, x + sw * k, y - h * k);
    g.quadraticCurveTo(x + w * k * 0.7, y - h * k * 0.45, x + w * k / 2, y); g.fill();
  });
}
function fireWall(x0, x1, y, h, t) {
  glow(ORG, 30);
  for (let x = x0, i = 0; x <= x1; x += 34, i++) flame(x, y, 62, h * (0.65 + 0.35 * Math.sin(t * 5 + i * 1.7)), t, i);
  noglow();
}
function serpent(hx, hy, dir, len, t, s = 1) {
  const pts = []; for (let i = 0; i <= 36; i++) pts.push([hx - dir * i * len / 36, hy + Math.sin(i * 0.5 - t * 14) * 13 * s * Math.min(1, i / 6)]);
  for (let i = 30; i <= 36; i += 2) flame(pts[i][0], pts[i][1] + 10 * s, 26 * s, 36 * s, t, i);
  glow('#FF5A1F', 26); line(pts, '#E8421A', 15 * s); noglow(); line(pts, ORG, 9 * s); line(pts, '#FFE08A', 3.5 * s);
  g.save(); g.translate(hx, hy); g.scale(dir * s, s);
  glow(ORG, 22); ell(-4, 0, 24, 17, '#E8421A'); noglow(); ell(-2, 0, 16, 11, ORG);
  poly([[6, -7], [30, 0], [6, 7]], '#FFE08A'); circ(8, -4, 2.2, '#FFF'); circ(8, 4, 2.2, '#FFF');
  line([[30, 0], [40, -4]], '#FFF', 1.5); line([[30, 0], [40, 4]], '#FFF', 1.5);
  g.restore();
}
function sparks(x, y, r, n, t, c1, c2) {
  for (let i = 0; i < n; i++) { const a = i / n * 6.283 + rnd(i) * 0.4, rr = r * (0.6 + rnd(i + 5) * 0.6);
    line([[x + Math.cos(a) * rr * 0.8, y + Math.sin(a) * rr * 0.8], [x + Math.cos(a) * rr, y + Math.sin(a) * rr]], i % 2 ? c1 : c2, 2.5); }
}
function impactFrame(c, cx, cy, sil) {            // three flat colors only: black, white, the energy color
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 28; i++) { const a = i / 28 * 6.283, a2 = a + 0.07 + rnd(i) * 0.06, R = 900;
    poly([[cx, cy], [cx + Math.cos(a) * R, cy + Math.sin(a) * R], [cx + Math.cos(a2) * R, cy + Math.sin(a2) * R]], i % 2 ? c : '#FFF'); }
  circ(cx, cy, 46, '#FFF');
  if (sil) { FLAT = '#000'; sil(); FLAT = null; }
}
function wheel(x, y, r, rot, c) {
  g.strokeStyle = col(c); g.lineWidth = r * 0.14; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
  g.lineWidth = r * 0.07; for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); g.stroke(); }
  circ(x, y, r * 0.16, c);
}

/* ---------- characters ---------- */
function headgear(who, r) {                         // drawn around a head of radius r centred at 0,0
  g.fillStyle = col(INK);
  if (who === 'Sh') { ell(0, -r * 0.5, r * 1.25, r * 0.8, '#23402E'); return; }
  g.beginPath(); g.arc(0, -r * 0.15, r * 1.06, Math.PI * 0.95, Math.PI * 2.05); g.fill();
  if (who === 'A') { g.fillStyle = col('#E8B92F'); g.fillRect(-r, -r * 0.62, r * 2, r * 0.26); poly([[r * 0.5, -r * 0.6], [r * 0.75, -r * 1.25], [r, -r * 0.6]], BLUE); }
  if (who === 'Ab') { g.fillStyle = col('#FFF'); g.fillRect(-r, -r * 0.6, r * 2, r * 0.28); line([[-r, -r * 0.45], [-r * 1.9, -r * 0.1]], '#FFF', r * 0.2); }
  if (who === 'K' || who === 'Kg') { circ(-r * 0.3, -r * 1.25, r * 0.5, INK); g.fillStyle = col(INK); g.beginPath(); g.arc(r * 0.2, r * 0.2, r * 0.95, -0.2, Math.PI * 0.75); g.fill(); }
  if (who === 'Kr') { poly([[-r, -r * 0.5], [r, -r * 0.5], [r * 0.7, -r * 1.2], [-r * 0.7, -r * 1.2]], '#E8B92F'); ell(r * 0.25, -r * 2.0, r * 0.38, r * 0.95, '#1E8C8C', 0.2); ell(r * 0.3, -r * 2.2, r * 0.2, r * 0.3, '#2C5AA8', 0.2);
    g.fillStyle = col(INK); g.fillRect(-r * 1.05, -r * 0.2, r * 0.5, r * 2.2); }
}
/* Full figure, side view. x,y = feet. Poses: hold, draw, aimup, reins, stand, lower. */
function figure(x, y, s, dir, who, o = {}) {
  const C = CH[who], pose = o.pose || 'hold', pull = o.pull ?? 1;
  g.save(); g.translate(x, y); g.scale(dir * s, s);
  g.fillStyle = col(C.cloth); g.fillRect(-7, -40, 6, 40); g.fillRect(1, -40, 6, 40);
  poly([[-9, -40], [9, -40], [11, -74], [-11, -74]], C.armor);
  g.fillStyle = col(C.sash); g.fillRect(-9, -47, 18, 5);
  if (who === 'K' || who === 'Kg') { if (o.lit) glow(ORG, 12); circ(3, -62, 3.6, '#FFD75A'); noglow(); }
  if (who === 'Kr') poly([[-11, -74], [-4, -74], [-16 - (o.wind || 0) * 10, -30], [-22 - (o.wind || 0) * 10, -34]], '#E8B92F');
  g.save(); g.translate(0, -84 + (o.nod || 0)); circ(0, 0, 8, C.skin); headgear(who, 8);
  if (s > 2) { o.eyesClosed ? line([[2, -1], [6, -1]], INK, 0.8) : circ(4.5, -1, 1, INK); }
  g.restore();
  const arm = pts => line(pts, C.skin, 4);
  const lit = o.lit ? C.energy : null;
  if (pose === 'draw' || pose === 'aimup') {
    g.save(); if (pose === 'aimup') { g.translate(0, -72); g.rotate(-0.95); g.translate(0, 72); }
    const hx = 26 - 22 * pull;
    bow(26, -70, 64, 6 + pull * 5, C.bow, 26 - hx, lit);
    arm([[6, -72], [26, -70]]); arm([[-8, -72], [-18, -68], [hx, -70]]);
    if (o.arrow !== false) arrow(hx + 38, -70, 0, 38, o.head || C.energy, o.crescent ? 6 : 4);
    g.restore();
  } else if (pose === 'hold') { arm([[8, -70], [15, -52]]); arm([[-10, -72], [-12, -48]]); bow(15, -52, 72, 7, C.bow, 0, lit); }
  else if (pose === 'reins') { arm([[6, -68], [22, -52]]); arm([[4, -66], [20, -50]]); }
  else if (pose === 'lower') { arm([[8, -70], [14, -46]]); arm([[-10, -72], [-12, -48]]); g.save(); g.translate(14, -46); g.rotate(o.bowAng || 0); bow(0, 0, 72, 7, C.bow, 0, lit); g.restore(); }
  else { arm([[10, -72], [12, -48]]); arm([[-10, -72], [-12, -48]]); }
  if (who === 'A' || who === 'Ab') { g.fillStyle = col('#5A3A22'); g.fillRect(-15, -76, 5, 22); }
  g.restore();
}
function horse(x, y, c, ph, kneel) {
  const by = y - 44 + kneel * 16;
  for (let j = 0; j < 4; j++) {
    const lx = x - 18 + j * 12, a = Math.sin(ph + j * 1.7) * 0.7 * (1 - kneel), L = 34 * (1 - kneel * 0.5);
    if (kneel > 0.5 && j > 1) line([[lx, by + 6], [lx + 12, by + 14], [lx + 2, by + 18]], c, 4);
    else line([[lx, by + 6], [lx + Math.sin(a) * L * 0.5, by + 6 + L * 0.5], [lx + Math.sin(a * 1.6) * L * 0.9, by + 6 + L]], c, 4);
  }
  ell(x, by, 27, 11, c);
  poly([[x + 16, by - 8], [x + 34, by - 30 + kneel * 12], [x + 42, by - 24 + kneel * 12], [x + 26, by + 4]], c);
  ell(x + 42, by - 28 + kneel * 14, 10, 5.5, c, 0.5);
  line([[x - 26, by - 4], [x - 40, by + 4 + Math.sin(ph) * 5], [x - 44, by + 16]], c, 3.5);
}
/* Chariot, side view, facing +x before dir. x,y = where the wheel meets the ground. */
function chariot(x, y, s, dir, kind, o = {}) {
  const K = CK[kind], t = o.t || 0;
  g.save(); g.translate(x, y + (o.sink || 0)); g.scale(dir * s, s);
  if (!o.noHorses) { horse(96, -3, K.horse2, (o.gallop || 0) + 1.3, o.kneel || 0); horse(80, 0, K.horse, o.gallop || 0, o.kneel || 0); }
  g.rotate(o.tilt || 0);
  line([[30, -26], [72, -40]], UMBER, 3);
  line([[-22, -50], [-22, -132]], UMBER, 2.2);
  g.fillStyle = col(K.banner); g.beginPath(); g.moveTo(-22, -130);
  for (let i = 0; i <= 8; i++) g.lineTo(-22 - i * 6, -130 + Math.sin(t * 8 + i * 0.9) * 2.5 * (i / 4));
  for (let i = 8; i >= 0; i--) g.lineTo(-22 - i * 6, -108 + Math.sin(t * 8 + i * 0.9 + 0.6) * 2.5 * (i / 4) - i * 0.6);
  g.fill();
  kind === 'A' ? ell(-40, -119, 6, 5.5, K.mark) : (g.strokeStyle = col(K.mark), g.lineWidth = 2, g.beginPath(), g.ellipse(-40, -119, 7, 4.5, 0, 0, 7), g.stroke());
  if (!o.noDriver) figure(15, -30, 0.72, 1, K.driver, Object.assign({ pose: 'reins', wind: 1 }, o.driver || {}));
  if (!o.noArcher) figure(-8, -32 + (o.duck || 0), 0.82, 1, o.archer || K.archer, Object.assign({ pose: o.pose || 'hold', pull: o.pull, lit: o.lit }, o.archerOpts || {}));
  if (!o.noDriver && !o.noHorses) line([[30, -64], [108, -62 + (o.kneel || 0) * 14]], UMBER, 0.9);
  poly([[-30, -28], [30, -28], [37, -60], [27, -55], [-30, -52]], K.car);
  g.strokeStyle = col(K.trim); g.lineWidth = 2.4; g.strokeRect(-29, -51, 56, 22);
  wheel(0, -20, 20, o.rot || 0, K.trim);
  g.restore();
}
/* Head and shoulders close up. dir: -1 looks left, 0 front, 1 looks right. */
function bust(cx, cy, s, who, o = {}) {
  const C = CH[who], d = o.dir || 0, fx = d * 9;
  g.save(); g.translate(cx, cy); g.scale(s, s);
  poly([[-98, 125], [-72, 48], [-22, 33], [22, 33], [72, 48], [98, 125]], C.armor);
  if (who === 'A' || who === 'Ab') { g.strokeStyle = col(C.trim); g.lineWidth = 1.6; for (let r = 0; r < 4; r++) for (let i = -4; i <= 4; i++) { g.beginPath(); g.arc(i * 17 + (r % 2) * 8, 60 + r * 17, 9, 0.2, Math.PI - 0.2); g.stroke(); }
    if (who === 'Ab') { g.globalAlpha = 0.8; ell(-60, 62, 20, 12, '#1A1410'); g.globalAlpha = 1; } }
  if (who === 'K' || who === 'Kg') { g.strokeStyle = col(C.trim); g.lineWidth = 1.6; for (let r = 0; r < 5; r++) { g.beginPath(); g.moveTo(-80 + r * 3, 58 + r * 14); g.lineTo(80 - r * 3, 58 + r * 14); g.stroke(); }
    const lit = o.glow || 0; if (lit) glow(ORG, 30 * lit);
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; line([[Math.cos(a) * 15, 92 + Math.sin(a) * 15], [Math.cos(a) * (23 + lit * 16), 92 + Math.sin(a) * (23 + lit * 16)]], lit ? '#FFD75A' : '#B8922E', 2.6); }
    circ(0, 92, 15, lit ? '#FFF1B0' : '#D4A93A'); noglow(); }
  if (who === 'Kr') { poly([[-72, 48], [-40, 40], [40, 125], [-10, 125]], '#F2CC55'); glow(GOLD, 10); circ(8, 78, 5, '#FFF'); noglow(); }
  g.fillStyle = col(C.skin); g.fillRect(-13, 12, 26, 28);
